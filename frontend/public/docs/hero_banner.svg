<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240" style="background: #08070b; border-radius: 12px; overflow: hidden; border: 1px solid rgba(139, 92, 246, 0.3);">
  <defs>
    <!-- Gradients -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="bgRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1035" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0e0a1a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#08070b" stop-opacity="1"/>
    </radialGradient>

    <!-- Filters for Bloom/Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); opacity: 0; }
        50% { opacity: 0.7; }
        100% { transform: translateY(260px); opacity: 0; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes textGlow {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(192, 132, 252, 0.4)); }
        50% { filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.9)); }
      }
      .node { animation: floatNode 4s ease-in-out infinite; }
      .path-pulse { stroke-dasharray: 6 4; animation: dash 1.5s linear infinite; }
      .scan { animation: scanline 4s ease-in-out infinite; }
      .brand-title { animation: textGlow 3s ease-in-out infinite; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace; }
      .grid-line { stroke: rgba(139, 92, 246, 0.08); stroke-width: 1; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" fill="url(#bgRadial)" />

  <!-- Cyber Grid -->
  <g>
    <line x1="0" y1="40" x2="900" y2="40" class="grid-line" />
    <line x1="0" y1="80" x2="900" y2="80" class="grid-line" />
    <line x1="0" y1="120" x2="900" y2="120" class="grid-line" />
    <line x1="0" y1="160" x2="900" y2="160" class="grid-line" />
    <line x1="0" y1="200" x2="900" y2="200" class="grid-line" />

    <line x1="100" y1="0" x2="100" y2="240" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="240" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="240" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="240" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="240" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="240" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="240" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="240" class="grid-line" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="120" r="140" fill="#8b5cf6" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="120;150;120" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="780" cy="110" r="130" fill="#06b6d4" opacity="0.1" filter="url(#glow)">
    <animate attributeName="r" values="110;140;110" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Connecting Graph Edges (with animated pulses) -->
  <!-- Left Side: User & Memory Nodes -->
  <path d="M 120 70 L 220 110" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4" />
  <path d="M 120 70 L 220 110" stroke="#c084fc" stroke-width="2" class="path-pulse" />

  <path d="M 120 170 L 220 110" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4" />
  <path d="M 120 170 L 220 110" stroke="#a855f7" stroke-width="2" class="path-pulse" />

  <path d="M 220 110 L 320 60" stroke="#8b5cf6" stroke-width="1.5" opacity="0.3" />
  <path d="M 220 110 L 320 160" stroke="#8b5cf6" stroke-width="1.5" opacity="0.3" />

  <!-- Right Side Graph Elements -->
  <path d="M 680 70 L 770 120" stroke="#06b6d4" stroke-width="1.5" opacity="0.3" />
  <path d="M 680 70 L 770 120" stroke="#22d3ee" stroke-width="2" class="path-pulse" />

  <path d="M 680 170 L 770 120" stroke="#8b5cf6" stroke-width="1.5" opacity="0.3" />
  <path d="M 680 170 L 770 120" stroke="#c084fc" stroke-width="2" class="path-pulse" />

  <path d="M 770 120 L 850 80" stroke="#06b6d4" stroke-width="1.5" opacity="0.4" />
  <path d="M 770 120 L 850 160" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4" />

  <!-- Nodes (Left) -->
  <g class="node" style="animation-delay: 0s;">
    <circle cx="120" cy="70" r="18" fill="#1e1338" stroke="#a855f7" stroke-width="2" filter="url(#softGlow)"/>
    <text x="120" y="74" fill="#e9d5ff" font-size="9" font-weight="700" text-anchor="middle" font-family="monospace">USER</text>
  </g>
  <g class="node" style="animation-delay: 1.5s;">
    <circle cx="120" cy="170" r="16" fill="#102330" stroke="#06b6d4" stroke-width="1.8" filter="url(#softGlow)"/>
    <text x="120" y="174" fill="#a5f3fc" font-size="8" font-weight="700" text-anchor="middle" font-family="monospace">TASK</text>
  </g>
  <g class="node" style="animation-delay: 0.8s;">
    <circle cx="220" cy="110" r="24" fill="#2e1065" stroke="#c084fc" stroke-width="2.5" filter="url(#glow)"/>
    <text x="220" y="114" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">DECISION</text>
  </g>

  <!-- Nodes (Right) -->
  <g class="node" style="animation-delay: 1s;">
    <circle cx="680" cy="70" r="16" fill="#1e1338" stroke="#8b5cf6" stroke-width="1.8" filter="url(#softGlow)"/>
    <text x="680" y="74" fill="#e9d5ff" font-size="8" font-weight="700" text-anchor="middle" font-family="monospace">REASON</text>
  </g>
  <g class="node" style="animation-delay: 2.2s;">
    <circle cx="680" cy="170" r="16" fill="#062d2a" stroke="#10b981" stroke-width="1.8" filter="url(#softGlow)"/>
    <text x="680" y="174" fill="#6ee7b7" font-size="8" font-weight="700" text-anchor="middle" font-family="monospace">OUTCOME</text>
  </g>
  <g class="node" style="animation-delay: 0.5s;">
    <circle cx="770" cy="120" r="22" fill="#132337" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
    <text x="770" y="124" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle" font-family="monospace">NEO4J</text>
  </g>

  <!-- Center Branding -->
  <g>
    <!-- Badge Pill -->
    <rect x="360" y="32" width="180" height="22" rx="11" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
    <circle cx="374" cy="43" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="455" y="47" fill="#c084fc" font-size="10" font-family="monospace" letter-spacing="1.5" text-anchor="middle" font-weight="600">NEO4J HACKATHON 2026</text>

    <!-- Main Title -->
    <text x="450" y="105" fill="#ffffff" font-size="44" font-weight="900" letter-spacing="5" text-anchor="middle" class="brand-title">MEMORA</text>

    <!-- Subtitle / Tagline -->
    <text x="450" y="138" fill="#d8b4fe" font-size="13" font-family="monospace" letter-spacing="2" text-anchor="middle" font-weight="500">
      AUTONOMOUS DECISION GRAPH &amp; MEMORY AGENT
    </text>

    <!-- Sub-features Bar -->
    <text x="450" y="175" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" text-anchor="middle">
      <tspan fill="#a855f7">●</tspan> Multi-Hop Cypher Reasoning  
      <tspan fill="#06b6d4" dx="12">●</tspan> 60 FPS ASCII Companion  
      <tspan fill="#10b981" dx="12">●</tspan> Google Calendar Timeline
    </text>

    <!-- Terminal Prompt Decorator -->
    <rect x="330" y="196" width="240" height="24" rx="4" fill="rgba(0, 0, 0, 0.6)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1" />
    <text x="342" y="212" fill="#a855f7" font-size="11" font-family="monospace">&gt;</text>
    <text x="356" y="212" fill="#38bdf8" font-size="10.5" font-family="monospace">sys.replay(&quot;presentation&quot;)</text>
    <rect x="526" y="202" width="6" height="12" fill="#c084fc">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Glowing Laser Scanline across banner -->
  <rect x="0" y="0" width="900" height="2" fill="url(#purpleGlow)" opacity="0.4" class="scan" />
</svg>
